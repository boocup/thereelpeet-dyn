<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="180"
   height="380"
   viewBox="0 0 180 380"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg">
  <defs id="defs1">
    <linearGradient id="bgGradUndertow" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d0d0d0" id="stopUndertow1" />
      <stop offset="100%" stop-color="#b8b8b8" id="stopUndertow2" />
    </linearGradient>
  </defs>

  <!-- 12HP. Same background and palette as res/TheReelPeetEvo.svg. All
       labels are drawn in C++ (src/TheReelPeetUndertow.cpp) since nanosvg
       doesn't render <text>; box positions here match the mm coordinates
       there (1mm = 2.9528px). -->
  <rect id="panel" x="0" y="0" width="180" height="380" fill="url(#bgGradUndertow)" />

  <!-- Global controls (Pace, Rest, Entropy, Clock, Recall, Drift, Mix): red,
       like Evo's global lane. 14mm to 52.5mm. -->
  <rect x="7" y="41.34" width="166" height="113.68" rx="7" ry="7"
        fill="#d94a4a" opacity="0.18" stroke="#d94a4a" stroke-opacity="0.55" stroke-width="1.5" id="globalBox" />

  <!-- Lanes 1-2, Evo's blue and orange. 54.5mm to 121.5mm (clear of the
       bottom screws), centered on the lane x positions in the widget
       (16.09/44.87mm). -->
  <rect x="7" y="160.93" width="81" height="197.84" rx="7" ry="7"
        fill="#4a78d9" opacity="0.18" stroke="#4a78d9" stroke-opacity="0.55" stroke-width="1.5" id="lane1" />
  <rect x="92" y="160.93" width="81" height="197.84" rx="7" ry="7"
        fill="#d9824a" opacity="0.18" stroke="#d9824a" stroke-opacity="0.55" stroke-width="1.5" id="lane2" />

  <!-- Dark plates behind every output (Mix, and each lane's Out + Env), the
       usual VCV convention for telling outputs from inputs. Their labels
       are drawn white in the widget. -->
  <rect x="136.57" y="113.68" width="31.00" height="39.27" rx="4" ry="4" fill="#2b2b2b" id="mixPlate" />
  <rect x="51.20" y="268.70" width="31.00" height="80.61" rx="4" ry="4" fill="#2b2b2b" id="outPlate1" />
  <rect x="136.18" y="268.70" width="31.00" height="80.61" rx="4" ry="4" fill="#2b2b2b" id="outPlate2" />

