<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="258"
   height="380"
   viewBox="0 0 258 380"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg">
  <defs id="defs1">
    <linearGradient id="bgGradEvo" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d0d0d0" id="stopEvo1" />
      <stop offset="100%" stop-color="#b8b8b8" id="stopEvo2" />
    </linearGradient>
  </defs>

  <!-- Main panel background -->
  <rect id="panel" x="0" y="0" width="258" height="380" fill="url(#bgGradEvo)" />

  <!-- Global/shared playback lane — white, to read as neutral/control vs. the colored pools.
       Panel narrowed from 280 to 258 (trimmed excess left/right margin,
       keeping a small breathing gap on both sides) - everything below
       shifted left 7 raw units to close up the left margin, and the panel's
       right edge trimmed to leave a matching small margin after pool2/4. -->
  <rect x="7" y="12" width="56" height="356" rx="7" ry="7"
        fill="#ffffff" opacity="0.25" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5" id="laneLeft" />

  <!-- Center seam, between the shared lane and the phrase-pool section -->
  <rect x="68" y="0" width="1" height="380" fill="#000000" opacity="0.12" id="centerSeam" />

  <!-- 4 phrase pools, each a distinct bordered square to set them apart.
       Colors: pool1/pool2 are TheReelPeet-dyn's actual Lane A/Lane B colors
       (red/blue); pool3 is the gold this module already used; pool4 is a
       purple in the same family (dyn and Phrasing don't have a real 4th
       color to pull from). Arranged as a compact 2x2 grid (pool1 top-left,
       pool2 top-right, pool3 bottom-left, pool4 bottom-right), sized to hug
       their control content (Active + Entropy on one row, Recall + Drift
       on the next) rather than spanning the full panel height. -->
  <rect x="73"  y="25"  width="88" height="93" rx="7" ry="7"
        fill="#d94a4a" opacity="0.18" stroke="#d94a4a" stroke-opacity="0.55" stroke-width="1.5" id="pool1" />
  <rect x="163" y="25"  width="88" height="93" rx="7" ry="7"
        fill="#4a78d9" opacity="0.18" stroke="#4a78d9" stroke-opacity="0.55" stroke-width="1.5" id="pool2" />
  <rect x="73"  y="120" width="88" height="94" rx="7" ry="7"
        fill="#d9b44a" opacity="0.18" stroke="#d9b44a" stroke-opacity="0.55" stroke-width="1.5" id="pool3" />
  <rect x="163" y="120" width="88" height="94" rx="7" ry="7"
        fill="#9a5fd9" opacity="0.18" stroke="#9a5fd9" stroke-opacity="0.55" stroke-width="1.5" id="pool4" />

  <!-- Quantizer background, grey to set the two piano-key note-toggle
       columns (src/TheReelPeetEvo.cpp, NOTE_PARAM_L/R) apart from the
       phrase pools above, same visual treatment as pool1-4. Spans the
       same width as pool3+pool4 combined; pool3/4 were lifted 6px (y
       126->120) to close the gap and make room for this. Top/bottom
       margins sized with the piano buttons' own radius in mind (see
       whiteTopY/whitePitchY in the .cpp) so the topmost (B) and
       bottommost (C) buttons land fully inside, not overlapping the edge. -->
  <rect x="73" y="223" width="178" height="149" rx="7" ry="7"
        fill="#888888" opacity="0.18" stroke="#888888" stroke-opacity="0.55" stroke-width="1.5" id="quantizerBg" />

  <!-- The evolution-cycle flowchart (POOL/CROSS/MUTATE/KEEP?/EVOLVED, with
       Entropy+Jitter labeled) lives in src/TheReelPeetEvo.cpp as a C++
       widget (EvoFlowDiagram), not here. Rack's SVG panel loader (nanosvg)
       doesn't parse <text> at all, so any words baked into this file
       would silently never appear in the live VCV Rack view - the same
       reason the wordmark below is hand-traced <path> art instead of
       <text>, and every other panel label in this module is drawn via a
       C++ TransparentWidget. Tracing 7 more words by hand wasn't worth it
       when the C++ widget path already works and is proven on real
       MetaModule hardware throughout this file. -->

  <!-- Wordmark: THEREELPEET, same artwork as TheReelPeet.svg. Positioned and
       scaled by transforming every coordinate in the path data directly
       (not a <g transform>, which isn't proven to work on the actual
       MetaModule hardware rendering pipeline — the desktop VCV Rack
       simulator uses a different renderer than the real device). Top edge
       at y=12 (matching laneLeft/the pool rows' top), scaled 1.3x, T's
       left edge aligned with pool1's left edge, and shifted left 7 raw
       units along with everything else when the panel was narrowed from
       280 to 258. Computed with a script that correctly handles the
       "first m is absolute, later m is relative" SVG rule (a prior
       hand-edit that missed this garbled the wordmark). -->
