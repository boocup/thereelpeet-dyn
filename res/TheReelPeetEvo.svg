<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="286"
   height="380"
   viewBox="0 0 286 380"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg">
  <defs id="defs1">
    <linearGradient id="bgGradEvo" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d0d0d0" id="stopEvo1" />
      <stop offset="100%" stop-color="#b8b8b8" id="stopEvo2" />
    </linearGradient>
  </defs>

  <!-- Main panel background -->
  <rect id="panel" x="0" y="0" width="286" height="380" fill="url(#bgGradEvo)" />

  <!-- Global/shared playback lane — red, matching PhrasingModuleMM/res/
       Phrasing.svg's own red (#d94a4a) exactly, per a full-palette pass
       referencing that module's colors throughout this panel. Top edge
       (y=25) now matches the pool columns' top instead of sitting higher
       at y=12; bottom edge (368) unchanged, so height shrank to match.
       Panel narrowed from 280 to 258 (trimmed excess left/right margin,
       keeping a small breathing gap on both sides) - everything below
       shifted left 7 raw units to close up the left margin, and the panel's
       right edge trimmed to leave a matching small margin after the right
       column. Widened to 84 (from 56) to match the pool columns' own
       width exactly, per feedback - required widening the whole panel
       from 258 to 286 raw units (all 3 columns + margins + gaps no longer
       fit in 258 once all 3 are equal width), so everything from the Left
       quantizer column rightward shifted +28 raw units to make room (see
       poolColL/poolColR below, and the wordmark path data, which was
       shifted with a script rather than hand-edited for the same reason
       noted below). -->
  <rect x="7" y="25" width="84" height="343" rx="7" ry="7"
        fill="#d94a4a" opacity="0.18" stroke="#d94a4a" stroke-opacity="0.55" stroke-width="1.5" id="laneLeft" />

  <!-- Phrase pools 1&3 and the Left quantizer (src/TheReelPeetEvo.cpp
       NOTE_PARAM_L, which governs those same two phrases) merged into one
       continuous column - they're already the same functional group, so
       one box reads more honestly than 3 separate ones implying 3 separate
       things. Blue, matching Phrasing.svg's blue (#4a78d9). Spans from
       pool1's original top (y=25) down through the old quantizer bottom
       (y=365). No seam line against the lane to its left anymore (removed
       centerSeam) - the lane's own red vs. this blue already reads as a
       clear boundary without one. -->
  <rect x="101" y="25" width="84" height="340" rx="7" ry="7"
        fill="#4a78d9" opacity="0.18" stroke="#4a78d9" stroke-opacity="0.55" stroke-width="1.5" id="poolColL" />

  <!-- Same idea, phrases 2&4 + the Right quantizer (NOTE_PARAM_R). Orange
       (#d9824a, roughly midway in hue between the lane's red and this
       module's gold) - purple sat too close to the Left column's blue on
       the color wheel to read as clearly distinct; green and gold were
       tried earlier too (green clashed with the quantizer's own green
       LEDs, gold didn't land as "yellow"). -->
  <rect x="195" y="25" width="84" height="340" rx="7" ry="7"
        fill="#d9824a" opacity="0.18" stroke="#d9824a" stroke-opacity="0.55" stroke-width="1.5" id="poolColR" />

  <!-- The evolution-cycle flowchart (POOL/CROSS/MUTATE/KEEP?/EVOLVED, with
       Entropy+Jitter labeled) lives in src/TheReelPeetEvo.cpp as a C++
       widget (EvoFlowDiagram), not here. Rack's SVG panel loader (nanosvg)
       doesn't parse <text> at all, so any words baked into this file
       would silently never appear in the live VCV Rack view - the same
       reason the wordmark below is hand-traced <path> art instead of
       <text>, and every other panel label in this module is drawn via a
       C++ TransparentWidget. Tracing 7 more words by hand wasn't worth it
       when the C++ widget path already works and is proven on real
       MetaModule hardware throughout this file. -->

  <!-- Wordmark: THEREELPEET, same artwork as TheReelPeet.svg. Positioned and
       scaled by transforming every coordinate in the path data directly
       (not a <g transform>, which isn't proven to work on the actual
       MetaModule hardware rendering pipeline — the desktop VCV Rack
       simulator uses a different renderer than the real device). Top edge
       at y=12 (matching laneLeft/the pool rows' top), scaled 1.3x, T's
       left edge aligned with pool1's left edge, and shifted left 7 raw
       units along with everything else when the panel was narrowed from
       280 to 258. Computed with a script that correctly handles the
       "first m is absolute, later m is relative" SVG rule (a prior
       hand-edit that missed this garbled the wordmark). -->
