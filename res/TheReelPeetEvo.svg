     style="fill:#000000"
     aria-label="THEREELPEET" />
  <path
     d="M 83.227258 14.570311 h -3.602095 v 8.890132 h -1.340629 v -8.890132 h -3.602096 v -1.191671 h 8.544819 z m 12.121174 8.890132 h -1.340629 v -4.935953 h -5.030745 v 4.935953 h -1.340629 v -10.081803 h 1.340629 V 17.332820 h 5.030745 v -3.954180 h 1.340629 z m 12.405550 0.000000 h -6.642208 v -10.081803 h 6.642208 v 1.191671 H 102.452403 V 17.332820 h 5.301579 v 1.191670 h -5.301579 v 3.744283 h 5.301579 z m 13.522740 0.000000 H 119.536613 L 116.164728 19.452097 H 114.275660 v 4.008346 h -1.340630 v -10.081803 h 2.823447 q 0.914065 0.000000 1.523443 0.121875 q 0.609376 0.115102 1.096879 0.419792 q 0.548439 0.345314 0.853128 0.873441 q 0.311459 0.521355 0.311459 1.327087 q 0.000000 1.090107 -0.548440 1.828132 q -0.548439 0.731251 -1.509901 1.103649 z m -3.134906 -7.244814 q 0.000000 -0.433334 -0.155730 -0.765107 q -0.148958 -0.338542 -0.501043 -0.568751 q -0.291147 -0.196355 -0.690626 -0.270834 q -0.399481 -0.081250 -0.941149 -0.081250 H 114.275660 v 3.805220 h 1.354171 q 0.636459 0.000000 1.110420 -0.108329 q 0.473959 -0.115102 0.805732 -0.419793 q 0.304688 -0.284376 0.446876 -0.650001 q 0.148958 -0.372398 0.148958 -0.941149 z m 14.132118 7.244814 h -6.642208 v -10.081803 h 6.642208 v 1.191671 H 126.972356 V 17.332820 h 5.301579 v 1.191670 h -5.301579 v 3.744283 h 5.301579 z m 11.823258 0.000000 H 137.454985 v -10.081803 h 6.642208 v 1.191671 H 138.795614 V 17.332820 h 5.301579 v 1.191670 h -5.301579 v 3.744283 h 5.301579 z m 11.559196 0.000000 h -6.378146 v -10.081803 h 1.340630 v 8.890133 h 5.037516 z m 10.990441 -7.034918 q 0.000000 0.670314 -0.236981 1.245837 q -0.230209 0.568753 -0.650001 0.988545 q -0.521356 0.521356 -1.232296 0.785420 q -0.710940 0.257292 -1.794277 0.257292 h -1.340629 v 3.757824 h -1.340629 v -10.081803 h 2.735425 q 0.907295 0.000000 1.536985 0.155730 q 0.629689 0.148959 1.117190 0.473961 q 0.575523 0.385939 0.886982 0.961462 q 0.318231 0.575522 0.318231 1.455734 z m -1.394797 0.033852 q 0.000000 -0.521356 -0.182813 -0.907295 q -0.182