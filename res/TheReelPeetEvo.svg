<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="150"
   height="380"
   viewBox="0 0 150 380"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg">
  <defs id="defs1">
    <linearGradient id="bgGradEvo" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d0d0d0" id="stopEvo1" />
      <stop offset="100%" stop-color="#b8b8b8" id="stopEvo2" />
    </linearGradient>
  </defs>

  <!-- Main panel background -->
  <rect id="panel" x="0" y="0" width="150" height="380" fill="url(#bgGradEvo)" />

  <!-- Left "lane" (playback controls) — same geometry as TheReelPeet's Lane A -->
  <rect x="14" y="12" width="56" height="356" rx="7" ry="7"
        fill="#8a4ad9" opacity="0.16" stroke="#000000" stroke-opacity="0.08" stroke-width="1" id="laneLeft" />
  <!-- Right "lane" (evolution controls: Drift/Persist/Pool) — same geometry as TheReelPeet's Lane B -->
  <rect x="80" y="12" width="56" height="356" rx="7" ry="7"
        fill="#8a4ad9" opacity="0.16" stroke="#000000" stroke-opacity="0.08" stroke-width="1" id="laneRight" />

  <!-- Center seam, matching TheReelPeet.svg exactly (x=74.5) -->
  <rect x="74.5" y="0" width="1" height="380" fill="#000000" opacity="0.12" id="centerSeam" />

  <!-- NOTE: no <text> elements here. Rack's SVG panel loader (nanosvg) does
       not parse <text> at all (only path/rect/circle/line/polygon/g), so
       every label is drawn from C++ at runtime instead — see EvoStaticLabel
       in TheReelPeetEvo.cpp. TheReelPeet.svg works around the same
       limitation by hand-tracing its wordmark/labels into <path> data. -->
</svg>
